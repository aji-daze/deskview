name: Build debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 署名鍵が実行ごとに変わると、端末側で「既存のパッケージと競合」して更新できない。
      # 固定鍵は GitHub Secrets から復元する（鍵とパスワードはリポジトリに置かない）。
      - name: Restore signing keystore
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > keystore/signing.p12

      # gradle-wrapper.jar はバイナリのためリポジトリに含めていない。
      # ここで Gradle 本体をセットアップし、wrapper ファイル一式を生成してから ./gradlew を使う。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      # APK が固定鍵で署名されたかを確認する。証明書の指紋は毎回同じになるはず。
      - name: Show APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "DN:|SHA-256 digest"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deskview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
