name: Build debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 署名鍵が実行ごとに変わると、端末側で「既存のパッケージと競合」して更新できない。
      # 初回だけ固定鍵を生成してリポジトリに commit し、以降は同じ鍵で署名する。
      - name: Ensure stable debug keystore
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -f keystore/deskview-debug.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -noprompt \
              -keystore keystore/deskview-debug.jks \
              -storepass deskview -keypass deskview -alias deskview \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DeskView Debug, O=DeskView, C=JP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/deskview-debug.jks
            git commit -m "Add fixed debug keystore so updates install over the previous build"
            git push origin HEAD:main
          fi

      # gradle-wrapper.jar はバイナリのためリポジトリに含めていない。
      # ここで Gradle 本体をセットアップし、wrapper ファイル一式を生成してから ./gradlew を使う。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # APK が固定鍵で署名されたかを確認する。証明書の指紋は毎回同じになるはず。
      - name: Show APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "DN:|SHA-256 digest"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deskview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
